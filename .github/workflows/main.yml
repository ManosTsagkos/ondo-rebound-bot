name: ONDO Rebound Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # κάθε 10 λεπτά
  workflow_dispatch:         # επιτρέπει χειροκίνητο trigger

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Ενεργοποιεί το Node.js 24
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python main.py
